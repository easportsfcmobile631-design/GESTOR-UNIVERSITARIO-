<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matemáticas - TITAN</title>
<style>
body{ background:#001f3f; color:white; font-family:Arial; margin:0; padding:10px; }
h1,h2{ text-align:center; margin:5px; }
.tabla-cont{ overflow:auto; border:3px solid black; background:#001f3f; margin-top:10px; }
table{ border-collapse:collapse; width:100%; background:#001f3f; }
th,td{ border:2px solid black; text-align:center; padding:5px; }
th{ background:#002a5c; color:white; position:sticky; top:0; font-size:11px; }
td:first-child{ background:#002a5c; font-weight:bold; position:sticky; left:0; z-index:2; }

.circulo{
 width:44px; height:44px; border-radius:50%; display:inline-flex; justify-content:center; align-items:center;
 font-weight:bold; color:black; font-size:13px; cursor:pointer; position:relative; border:1.5px solid black; user-select:none;
}
.circulo sup{ position:absolute; top:-5px; right:-6px; background:black; color:white; border-radius:50%; width:18px; height:15px; font-size:10px; display:flex; justify-content:center; align-items:center; border:1px solid white; }
.blanco{ background:white; }
.rojo{ background:#e60000; }
.verde{ background:#00b050; }
.amarillo{ background:#ffcc00; }
.naranja{ background:#ff8000; }

.calif{ font-weight:bold; font-size:20px; min-width:60px; }
.btns{ text-align:center; margin:15px; }
button{ background:white; color:black; border:2px solid black; padding:12px 35px; margin:0 10px; font-weight:bold; cursor:pointer; border-radius:6px; font-size:14px; }
</style>
</head>
<body>

<h1>Bienvenido Profesor</h1>
<h2>Matemáticas</h2>

<div class="tabla-cont">
<table id="tabla">
<thead>
<tr>
<th>Alumno</th><th>U00</th><th>U01</th><th>U02</th><th>U03</th><th>U04</th><th>U05</th><th>U06</th><th>U07</th><th>U08</th><th>U09</th><th>U10</th><th>Calificación</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="btns">
<button onclick="guardar()">Guardar</button>
<button onclick="salir()">Salir</button>
</div>

<script>
const COLORES = [
 {clase:'blanco', letra:'EC', valor:0},
 {clase:'rojo', letra:'NA', valor:7},
 {clase:'verde', letra:'AP', valor:8},
 {clase:'amarillo', letra:'RE', valor:9},
 {clase:'naranja', letra:'EN', valor:10}
];
const TOTAL = 155; //31x5
let datos = JSON.parse(localStorage.getItem('titan_final') || '{}');

function crearTabla(){
 const tbody=document.getElementById('tbody');
 for(let a=1;a<=100;a++){
  let tr=document.createElement('tr');
  tr.innerHTML=`<td>Alumno ${a}</td>`;
  for(let u=0;u<=10;u++){
   let key=`${a}-${u}`;
   if(datos[key]===undefined) datos[key]=0; // Inicia en blanco 0
   let td=document.createElement('td');
   td.id=`cell-${key}`;
   td.appendChild(crearCirculo(datos[key], key));
   tr.appendChild(td);
  }
  let tdCal=document.createElement('td');
  tdCal.id=`cal-${a}`;
  tdCal.className='calif';
  tr.appendChild(tdCal);
  tbody.appendChild(tr);
  actualizarCalif(a);
 }
}

function crearCirculo(totalIdx, key){
 let div=document.createElement('div');
 div.className='circulo';
 let turno=Math.floor(totalIdx/5);
 let cIdx=totalIdx%5;
 let c=COLORES[cIdx];
 div.classList.add(c.clase);
 div.innerHTML=`${c.letra}<sup>${turno}</sup>`;
 div.title=`${c.letra} Turno ${turno} = ${c.valor}`;
 div.onclick=()=>clickCirculo(key);
 return div;
}

function clickCirculo(key){
 let actual=datos[key];
 actual=(actual+1)%TOTAL;
 datos[key]=actual;
 let cell=document.getElementById(`cell-${key}`);
 cell.innerHTML='';
 cell.appendChild(crearCirculo(actual,key));
 let alumno=key.split('-')[0];
 actualizarCalif(alumno);
 localStorage.setItem('titan_final', JSON.stringify(datos));
}

function actualizarCalif(alumno){
 let suma=0, hayEC=false, hayNA=false;
 for(let u=0;u<=10;u++){
  let key=`${alumno}-${u}`;
  let idx=datos[key];
  let cIdx=idx%5;
  let c=COLORES[cIdx];
  if(c.letra==='EC') hayEC=true;
  if(c.letra==='NA') hayNA=true;
  suma+=c.valor;
 }
 let td=document.getElementById(`cal-${alumno}`);
 if(hayEC){
  td.innerHTML='****';
  td.style.color='white';
  td.style.background='transparent';
  return;
 }
 let prom=suma/11;
 let dec=prom-Math.floor(prom);
 let entero = dec >=0.6 ? Math.ceil(prom) : Math.floor(prom);
 td.innerHTML=entero;
 if(hayNA){
  td.style.color='#e60000'; // Rojo por reprobado
  td.style.background='white';
  td.style.borderRadius='50%';
  td.style.width='44px'; td.style.height='44px';
  td.style.display='inline-flex'; td.style.justifyContent='center'; td.style.alignItems='center';
 } else {
  // Color natural
  if(entero===7){ td.style.color='#e60000'; td.style.background='white'; }
  else if(entero===8){ td.style.color='white'; td.style.background='#00b050'; }
  else if(entero===9){ td.style.color='black'; td.style.background='#ffcc00'; }
  else if(entero>=10){ td.style.color='black'; td.style.background='#ff8000'; }
  else { td.style.color='white'; td.style.background='transparent'; }
  td.style.borderRadius='50%';
  td.style.width='44px'; td.style.height='44px';
  td.style.display='inline-flex'; td.style.justifyContent='center'; td.style.alignItems='center';
 }
}

function guardar(){
 localStorage.setItem('titan_final', JSON.stringify(datos));
 alert('Guardado TITAN - Datos permanecen, no se borran');
}
function salir(){
 guardar();
 alert('Puedes cerrar la pestaña, todo guardado');
}
crearTabla();
</script>
</body>
 </html>
